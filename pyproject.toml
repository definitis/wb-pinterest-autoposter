[project]
name = "wb-pinterest-autoposter"
version = "0.1.0"
description = "MVP autoposting pipeline for new Wildberries products to VK and Pinterest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromedriver-autoinstaller>=0.6,<1",
    "httpx>=0.27,<1",
    "pillow>=10,<12",
    "playwright>=1.44,<2",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "selenium==4.19.0",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
    "undetected-chromedriver==3.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
wb-autoposter = "wb_autoposter.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
